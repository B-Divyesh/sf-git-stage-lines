[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "git-stage-lines"
version = "0.1.0"
description = "Typed Python wrapper for the git-stage-lines executable"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sociobot Param Factory" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License"
]

[tool.setuptools]
packages = ["git_stage_lines"]

[tool.setuptools.package-data]
git_stage_lines = ["py.typed"]
